<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Profile Card Template -->
    <div class="profile-card">
        <div class="card-header">
            <div class="profile-img-container">
                <img src="https://placehold.net/avatar-1.svg" alt="User Profile Picture">
            </div>
        </div>
        
        <div class="card-content">
            <h2 class="user-name">Durgamahadev Parida</h2>
            <p class="user-profession">Angular/React Designer</p>
            <p class="user-bio">Passionate creator focusing on interactive web layouts and modern visual identities. Helping brands turn complex ideas into beautiful products.</p>
            
            <div class="social-links">
                <a href="#" class="facebook" title="Facebook"><i class="fi fi-brands-facebook"></i></a>
                <a href="#" class="twitter" title="Twitter"><i class="fi fi-brands-twitter-alt-circle"></i></a>
                <a href="#" class="linkedin" title="LinkedIn"><i class="fi fi-brands-linkedin"></i></a>
                <a href="https://github.com/durgamahadev/angular" class="github" title="GitHub"><i class="fi fi-brands-github"></i></a>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-primary">Follow</button>
                <button class="btn btn-secondary">Message</button>
            </div>
        </div>
    </div>

</body>
</html>
